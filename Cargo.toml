[package]
name = "ertragbar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
fontdue = "0.9.3"
libc = "0.2.189"
nanoserde = { version = "0.2.1", default-features = false, features = ["json"] }
rustix = { version = "1.1.4", features = ["net", "time", "event", "mm"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["staging", "client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
